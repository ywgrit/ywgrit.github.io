<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">现代 Tomasulo 风格乱序核心的数据流</title>
  <desc id="desc">图示指令经重命名与分派进入保留站。独立乘法先执行并广播 T2；另一条加载完成后广播 T1，只有 T1 会匹配并唤醒等待 T1 的加法。现代 ROB 维护精确状态并按序退休，同时明确区分 1967 年原始 Tomasulo 与后来的 ROB。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#cbd5e1"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#34d399"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#38bdf8"/>
    </marker>
    <style>
      text { font-family: Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #f8fafc; }
      .h1 { font-size: 30px; font-weight: 700; }
      .h2 { font-size: 22px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 600; }
      .small { font-size: 14px; fill: #cbd5e1; }
      .tiny { font-size: 13px; fill: #cbd5e1; }
      .cpuText { fill: #38bdf8; }
      .gpuText { fill: #a78bfa; }
      .readyText { fill: #34d399; }
      .blockedText { fill: #fb7185; }
      .mono { font-family: "JetBrains Mono", "Noto Sans Mono CJK SC", monospace; font-size: 15px; }
      .panel { fill: #182235; stroke: #334155; stroke-width: 2; }
      .box { fill: #1e293b; stroke: #64748b; stroke-width: 1.7; }
      .flow { fill: none; stroke: #cbd5e1; stroke-width: 2.4; marker-end: url(#arrow); }
      .greenFlow { fill: none; stroke: #34d399; stroke-width: 3; marker-end: url(#arrowGreen); }
      .blueFlow { fill: none; stroke: #38bdf8; stroke-width: 3; marker-end: url(#arrowBlue); }
      .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .mobile { display: none; }
      .mTitle { font-size: 42px; font-weight: 700; }
      .mHead { font-size: 38px; font-weight: 700; }
      .mBody { font-size: 34px; font-weight: 600; }
      @media (max-width: 600px) {
        .desktop { display: none; }
        .mobile { display: inline; }
      }
    </style>
  </defs>

  <g class="desktop">
  <rect width="1200" height="760" fill="#111827"/>
  <text x="600" y="45" text-anchor="middle" class="h1">CPU：让等待者留下，让独立指令先走</text>
  <text x="600" y="74" text-anchor="middle" class="small">动作标签在前；括号内给出常用的现代微架构术语</text>

  <!-- Rename and dispatch -->
  <rect x="32" y="113" width="184" height="304" rx="20" class="panel"/>
  <text x="124" y="149" text-anchor="middle" class="h2 cpuText">换个名字再分流</text>
  <text x="124" y="174" text-anchor="middle" class="small">（重命名 / 分派）</text>
  <rect x="52" y="199" width="144" height="57" rx="10" fill="#4c1d2d" stroke="#fb7185" stroke-width="2"/>
  <text x="124" y="222" text-anchor="middle" class="mono">I1: add</text>
  <text x="124" y="244" text-anchor="middle" class="small">要等标签 T1</text>
  <rect x="52" y="272" width="144" height="57" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
  <text x="124" y="295" text-anchor="middle" class="mono">I2: mul</text>
  <text x="124" y="317" text-anchor="middle" class="small">源操作数已齐</text>
  <rect x="52" y="345" width="144" height="50" rx="10" class="box"/>
  <text x="124" y="367" text-anchor="middle" class="tiny">逻辑寄存器 →</text>
  <text x="124" y="386" text-anchor="middle" class="tiny">标签 / 物理寄存器</text>

  <!-- Reservation stations -->
  <rect x="262" y="113" width="262" height="304" rx="20" class="panel"/>
  <text x="393" y="149" text-anchor="middle" class="h2">先在座位上等齐</text>
  <text x="393" y="174" text-anchor="middle" class="small">（保留站 / Reservation Stations）</text>
  <rect x="282" y="199" width="222" height="78" rx="12" fill="#321d2a" stroke="#fb7185" stroke-width="2"/>
  <text x="300" y="225" class="mono">ADD: Vj=R3</text>
  <rect x="300" y="238" width="172" height="26" rx="7" fill="#4c1d2d"/>
  <text x="386" y="257" text-anchor="middle" class="label blockedText">R1 未就绪 · 等 T1</text>
  <rect x="282" y="295" width="222" height="83" rx="12" fill="#083b32" stroke="#34d399" stroke-width="2.5"/>
  <text x="300" y="321" class="mono">MUL: Vj=R5</text>
  <text x="300" y="345" class="mono">　　 Vk=R6</text>
  <text x="393" y="368" text-anchor="middle" class="label readyText">独立，立即可选</text>

  <path d="M216 228 L252 228" class="flow"/>
  <path d="M216 301 L252 322" class="greenFlow"/>
  <text x="234" y="211" text-anchor="middle" class="tiny">分派</text>

  <!-- Execution units -->
  <rect x="574" y="113" width="198" height="304" rx="20" class="panel"/>
  <text x="673" y="149" text-anchor="middle" class="h2">谁就绪谁执行</text>
  <text x="673" y="174" text-anchor="middle" class="small">（执行单元）</text>
  <rect x="596" y="206" width="154" height="65" rx="13" class="box"/>
  <text x="673" y="234" text-anchor="middle" class="label">ADD 单元</text>
  <text x="673" y="256" text-anchor="middle" class="small blockedText">等 T1 到达</text>
  <rect x="596" y="297" width="154" height="72" rx="13" fill="#064e3b" stroke="#34d399" stroke-width="2.5"/>
  <text x="673" y="327" text-anchor="middle" class="label">MUL 单元</text>
  <text x="673" y="352" text-anchor="middle" class="small">先产出 T2:value</text>
  <rect x="596" y="380" width="154" height="26" rx="8" fill="#082f49" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="673" y="398" text-anchor="middle" class="tiny cpuText">另一条 load 返回 T1</text>
  <path d="M504 337 L564 337" class="greenFlow"/>
  <path d="M504 238 L564 238" class="blueFlow"/>
  <text x="534" y="225" text-anchor="middle" class="tiny cpuText">T1 到达后</text>

  <!-- Result broadcast -->
  <rect x="822" y="113" width="168" height="304" rx="20" class="panel"/>
  <text x="906" y="143" text-anchor="middle" class="h2">把“谁完成”</text>
  <text x="906" y="168" text-anchor="middle" class="h2">喊出去</text>
  <text x="906" y="191" text-anchor="middle" class="small">（结果标签广播 / 唤醒）</text>
  <rect x="844" y="211" width="124" height="67" rx="33" fill="#064e3b" stroke="#34d399" stroke-width="2.5"/>
  <text x="906" y="239" text-anchor="middle" class="label readyText">T2</text>
  <text x="906" y="263" text-anchor="middle" class="small">MUL 结果</text>
  <rect x="844" y="315" width="124" height="67" rx="33" fill="#082f49" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="906" y="343" text-anchor="middle" class="label cpuText">T1</text>
  <text x="906" y="367" text-anchor="middle" class="small">load 结果</text>
  <path d="M772 333 C799 333 800 245 834 245" class="greenFlow"/>
  <path d="M750 393 C786 393 800 349 834 349" class="blueFlow"/>
  <path d="M844 372 C790 486 532 490 504 268" class="blueFlow"/>
  <text x="657" y="482" text-anchor="middle" class="small cpuText">只有 T1 匹配 ADD 的等待项 → ADD 变为就绪</text>

  <!-- Modern ROB -->
  <rect x="1024" y="113" width="144" height="424" rx="20" fill="#182235" stroke="#38bdf8" stroke-width="2"/>
  <text x="1096" y="143" text-anchor="middle" class="h2 cpuText">按程序顺序</text>
  <text x="1096" y="168" text-anchor="middle" class="h2 cpuText">收尾</text>
  <text x="1096" y="191" text-anchor="middle" class="small">（现代 ROB）</text>
  <g>
    <rect x="1044" y="201" width="104" height="49" rx="8" class="box"/>
    <text x="1096" y="231" text-anchor="middle" class="mono">I0 ✓</text>
    <rect x="1044" y="260" width="104" height="49" rx="8" fill="#321d2a" stroke="#fb7185"/>
    <text x="1096" y="290" text-anchor="middle" class="mono">I1 …</text>
    <rect x="1044" y="319" width="104" height="49" rx="8" fill="#083b32" stroke="#34d399"/>
    <text x="1096" y="349" text-anchor="middle" class="mono">I2 ✓</text>
  </g>
  <path d="M1096 385 L1096 431" class="flow"/>
  <text x="1096" y="461" text-anchor="middle" class="label">顺序退休</text>
  <text x="1096" y="485" text-anchor="middle" class="small">提交精确状态</text>
  <text x="1096" y="507" text-anchor="middle" class="small">处理异常恢复</text>
  <path d="M990 245 L1014 245" class="flow"/>

  <!-- Explicit historical boundary -->
  <rect x="32" y="557" width="1136" height="132" rx="18" fill="#0f172a" stroke="#fb7185" stroke-width="2"/>
  <text x="58" y="592" class="h2 blockedText">历史边界：不要把两个年代画成一台机器</text>
  <text x="58" y="624" class="label">1967 年原始 Tomasulo 算法没有图中这个后来出现的现代 ROB。</text>
  <text x="58" y="653" class="small">这里画 ROB，是为了表示现代乱序核心的精确状态与按序退休边界；它不是对 IBM 360/91 原始结构的复刻。</text>
  <text x="58" y="676" class="small">核心思想仍是：用标签解除假相关，让独立操作先执行，再按依赖关系唤醒真正的消费者。</text>

  <text x="600" y="730" text-anchor="middle" class="label">在一个较小的线程集合里，把很多条未完成指令同时摊开管理</text>
  </g>

  <g class="mobile">
    <rect width="1200" height="760" fill="#111827"/>
    <text x="600" y="66" text-anchor="middle" class="mTitle">Tomasulo 风格：标签必须匹配</text>

    <rect x="42" y="105" width="1116" height="230" rx="28" class="panel"/>
    <text x="78" y="157" class="mHead readyText">独立路径：MUL 不等 T1</text>
    <rect x="78" y="195" width="245" height="82" rx="18" fill="#064e3b" stroke="#34d399" stroke-width="4"/>
    <text x="201" y="247" text-anchor="middle" class="mBody">MUL 就绪</text>
    <path d="M338 236 L420 236" class="greenFlow"/>
    <rect x="435" y="195" width="245" height="82" rx="18" fill="#064e3b" stroke="#34d399" stroke-width="4"/>
    <text x="558" y="247" text-anchor="middle" class="mBody">执行 → 广播 T2</text>
    <path d="M695 236 L777 236" class="greenFlow"/>
    <rect x="792" y="195" width="320" height="82" rx="18" fill="#083b32" stroke="#34d399" stroke-width="4"/>
    <text x="952" y="247" text-anchor="middle" class="mBody readyText">只唤醒等待 T2 者</text>
    <text x="600" y="314" text-anchor="middle" class="mBody">T2 不会唤醒正在等待 T1 的 ADD</text>

    <rect x="42" y="365" width="1116" height="230" rx="28" class="panel"/>
    <text x="78" y="417" class="mHead cpuText">依赖路径：load 完成后广播 T1</text>
    <rect x="78" y="455" width="245" height="82" rx="18" fill="#082f49" stroke="#38bdf8" stroke-width="4"/>
    <text x="201" y="507" text-anchor="middle" class="mBody">load 返回 T1</text>
    <path d="M338 496 L420 496" class="blueFlow"/>
    <rect x="435" y="455" width="245" height="82" rx="18" fill="#082f49" stroke="#38bdf8" stroke-width="4"/>
    <text x="558" y="507" text-anchor="middle" class="mBody">广播 T1</text>
    <path d="M695 496 L777 496" class="blueFlow"/>
    <rect x="792" y="455" width="320" height="82" rx="18" fill="#075985" stroke="#38bdf8" stroke-width="4"/>
    <text x="952" y="507" text-anchor="middle" class="mBody cpuText">ADD 匹配 T1 → 就绪</text>
    <text x="600" y="574" text-anchor="middle" class="mBody">结果标签决定谁被唤醒，程序顺序不决定执行先后</text>

    <rect x="42" y="625" width="1116" height="103" rx="24" fill="#0f172a" stroke="#fb7185" stroke-width="3"/>
    <text x="600" y="670" text-anchor="middle" class="mBody blockedText">1967 原始 Tomasulo 没有现代 ROB</text>
    <text x="600" y="710" text-anchor="middle" class="mBody">现代 ROB 负责精确状态与按序退休</text>
  </g>
</svg>
